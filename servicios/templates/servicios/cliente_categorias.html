<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Categorías - Oficio Connect SV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-5 text-center fw-bold">¿Qué servicio necesitas hoy?</h2>
        
        <div class="row g-4">
            {% for categoria in categorias %}
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0 text-center">
                    <div class="card-body d-flex flex-column justify-content-center py-4">
                        <h4 class="card-title text-dark fw-semibold mb-4">{{ categoria.name }}</h4>
                        
                        <a href="{% url 'trabajadores_categoria' categoria.id %}" class="btn btn-primary mt-auto rounded-pill px-4">
                            Ver especialistas
                        </a>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center py-5">
                <div class="p-5 bg-white rounded shadow-sm">
                    <span style="font-size: 3rem;">🛠️</span>
                    <h4 class="text-muted mt-3">Aún no hay categorías disponibles</h4>
                    <p class="text-secondary">Vuelve más tarde para ver los oficios agregados.</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
