<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Categorías - Oficio Connect SV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 text-center">¿Qué servicio necesitas hoy?</h2>
        
        <div class="row">
            {% for categoria in categorias %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm border-0 text-center">
                    <div class="card-body">
                        <h5 class="card-title text-primary">{{ categoria.name }}</h5>
                        
                        <a href="{% url 'trabajadores_categoria' categoria.id %}" class="btn btn-outline-primary mt-3">
                            Ver especialistas
                        </a>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center">
                <p class="text-muted">Aún no hay categorías disponibles.</p>
            </div>
            {% endfor %}
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
