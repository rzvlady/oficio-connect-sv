<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Oficio Connect SV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            margin-top: 5%;
            max-width: 400px;
        }
        .card {
            border: none;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="login-container w-100">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">Oficio Connect SV</h2>
                <p class="text-muted">Ingresa a tu cuenta</p>
            </div>

            <div class="card shadow-lg">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Login</h3>

                    <!-- Alertas de error -->
                    {% if error %}
                        <div class="alert alert-danger py-2 shadow-sm" role="alert">
                            <small>{{ error }}</small>
                        </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- Usuario -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" 
                                    name="username" 
                                    id="username" 
                                    class="form-control" 
                                    placeholder="Tu nombre de usuario"
                                    required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" 
                                    name="password" 
                                    id="password" 
                                    class="form-control" 
                                    placeholder="••••••••"
                                    required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                                Entrar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-muted">
                    ¿No tienes cuenta? 
                    <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Regístrate aquí</a>
                </p>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
